services:
  postgres:
    image: postgres:18
    container_name: workouttracker-postgres
    environment:
      POSTGRES_DB: workout_tracker
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: "pg_isready -U ${DB_USERNAME}"
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: workout-tracker-backend
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: