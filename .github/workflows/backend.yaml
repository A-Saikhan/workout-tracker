name: Build, Test and Publish

on:
  workflow_dispatch:

  push:
    paths:
      - 'workout-tracker/src/**'
      - 'workout-tracker/pom.xml'
      - '.github/workflows/backend.yaml'
      - 'workout-tracker/mvnw'
      - 'workout-tracker/.mvn/**'
  pull_request:
    paths:
      - 'workout-tracker/src/**'
      - 'workout-tracker/pom.xml'
      - '.github/workflows/backend.yaml'
      - 'workout-tracker/mvnw'
      - 'workout-tracker/.mvn/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: workout-tracker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: workout-tracker/pom.xml

      - name: Build with maven
        run: ./mvnw -B verify

  upload:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker Image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: workout-tracker/
          push: true
          tags: |
            ghcr.io/a-saikhan/workout-tracker:latest
            ghcr.io/a-saikhan/workout-tracker:${{ github.sha }}
