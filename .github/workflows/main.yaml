name: Java Build with Maven

on:
  workflow_dispatch:

  push:
    paths:
      - 'workout-tracker/src/**'
      - 'workout-tracker/pom.xml'
      - '.github/workflows/main.yaml'
  pull_request:
    paths:
      - 'workout-tracker/src/**'
      - 'workout-tracker/pom.xml'
      - '.github/workflows/main.yaml'

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: workout-tracker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: workout-tracker/pom.xml

      - name: Build with maven
        run: mvn -B verify