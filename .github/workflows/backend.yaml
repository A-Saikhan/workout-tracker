name: Build, Test and Publish

on:
  workflow_dispatch:

  push:
    paths:
      - 'workout-tracker/src/**'
      - 'workout-tracker/pom.xml'
      - '.github/workflows/backend.yaml'
      - 'workout-tracker/mvnw'
      - 'workout-tracker/.mvn/**'
  pull_request:
    paths:
      - 'workout-tracker/src/**'
      - 'workout-tracker/pom.xml'
      - '.github/workflows/backend.yaml'
      - 'workout-tracker/mvnw'
      - 'workout-tracker/.mvn/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: workout-tracker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: workout-tracker/pom.xml

      - name: Build with maven
        run: ./mvnw -B verify

  upload:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker Image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: workout-tracker/
          push: true
          tags: |
            ghcr.io/a-saikhan/workout-tracker:latest
            ghcr.io/a-saikhan/workout-tracker:${{ github.sha }}

  deploy:
    runs-on: ubuntu-24.04
    needs: upload
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    steps:
      - name: Prep the connection
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p -m 700 ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: SSH Keyscan
        run: ssh-keyscan "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Connecting and running the script
        run: ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" /home/"$SERVER_USER"/workout-tracker/deploy.sh

      - name: Delete the key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f ~/.ssh/known_hosts